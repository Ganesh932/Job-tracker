<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Job Tracker">
<link rel="manifest" href="manifest.webmanifest">
<title>Job Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f7f9;color:#111827}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:12px 15px;background:#111827;color:#fff;font-weight:650;cursor:pointer}.secondary{background:#eef0f3;color:#111827}.danger{background:#fee2e2;color:#991b1b}header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);padding:16px;border-bottom:1px solid #e5e7eb}h1{margin:0;font-size:25px;letter-spacing:-.5px}.sub{margin-top:4px;color:#6b7280;font-size:13px}main{max-width:760px;margin:auto;padding:14px 14px 96px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 14px}.stat{background:#fff;border-radius:15px;padding:12px 5px;text-align:center;border:1px solid #eceef1}.num{font-size:20px;font-weight:750}.label{font-size:11px;color:#6b7280;margin-top:2px}.toolbar{display:flex;gap:8px;margin-bottom:10px}.toolbar>*:first-child{flex:1}input,select,textarea{width:100%;padding:12px;border:1px solid #d7dbe0;border-radius:11px;background:#fff;color:#111827;outline:none}input:focus,select:focus,textarea:focus{border-color:#6b7280}.form{display:none;background:#fff;border:1px solid #e5e7eb;border-radius:17px;padding:16px;margin:12px 0}.form h2{margin:0 0 14px;font-size:20px}.field{margin-bottom:10px}.field label{display:block;font-size:12px;font-weight:650;color:#4b5563;margin:0 0 5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:flex;gap:8px;margin-top:5px}.actions>*{flex:1}.app{background:#fff;border:1px solid #e7e9ec;border-radius:17px;padding:15px;margin:10px 0}.app-head{display:flex;justify-content:space-between;gap:12px}.company{font-size:17px;font-weight:750}.role{font-size:14px;margin-top:2px}.muted{color:#6b7280;font-size:12px;margin-top:4px}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:650;white-space:nowrap}.contact{margin-top:12px;padding-top:11px;border-top:1px solid #eef0f2;font-size:13px}.contact a{color:#111827;text-decoration:none}.contact-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.contact-row a,.contact-row span{background:#f4f5f6;border-radius:9px;padding:7px 9px}.details{margin-top:10px}.details summary{font-size:13px;font-weight:650;cursor:pointer}.timeline{margin:10px 0 0 4px;border-left:2px solid #e5e7eb;padding-left:12px}.event{margin:0 0 11px;position:relative}.event:before{content:"";position:absolute;left:-18px;top:4px;width:7px;height:7px;border-radius:50%;background:#111827}.event strong{font-size:12px}.event small{display:block;color:#6b7280;margin-top:2px}.empty{text-align:center;color:#6b7280;padding:42px 15px}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid #e5e7eb;padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:20}.bottom button{width:100%}.notice{background:#eef6ff;border:1px solid #d8eaff;color:#1e40af;border-radius:13px;padding:11px 12px;font-size:12px;margin-bottom:12px}.small{font-size:11px;color:#6b7280}@media(max-width:430px){.stats{gap:6px}.stat{padding:11px 2px}.grid2{grid-template-columns:1fr}.toolbar button{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<header><h1>💼 Job Tracker</h1><div class="sub">Your simple job application dashboard</div></header>
<main>
<div class="notice">🔒 Your applications are stored on this device for now. Gmail and automatic status tracking will be added later.</div>
<section class="stats">
<div class="stat"><div class="num" id="total">0</div><div class="label">Applications</div></div>
<div class="stat"><div class="num" id="interviews">0</div><div class="label">Interviews</div></div>
<div class="stat"><div class="num" id="offers">0</div><div class="label">Offers</div></div>
<div class="stat"><div class="num" id="rejected">0</div><div class="label">Rejected</div></div>
</section>
<div class="toolbar"><input id="search" placeholder="Search company or role" autocomplete="off"><button onclick="openForm()">＋ Add</button></div>
<div class="toolbar"><select id="filter"><option value="">All statuses</option></select><select id="sourceFilter"><option value="">All sources</option><option>LinkedIn</option><option>Naukri</option><option>Other</option></select></div>

<section class="form" id="form">
<h2 id="formTitle">Add application</h2>
<div class="grid2">
<div class="field"><label>Company *</label><input id="company" placeholder="e.g. Cisco"></div>
<div class="field"><label>Job title</label><input id="role" placeholder="e.g. Network Engineer"></div>
</div>
<div class="grid2">
<div class="field"><label>Source</label><select id="source"><option>LinkedIn</option><option>Naukri</option><option>Other</option></select></div>
<div class="field"><label>Status</label><select id="status"></select></div>
</div>
<div class="grid2">
<div class="field"><label>Applied date</label><input id="applied" type="date"></div>
<div class="field"><label>Location</label><input id="location" placeholder="Hyderabad / Remote"></div>
</div>
<div class="grid2">
<div class="field"><label>Recruiter name</label><input id="recruiter" placeholder="Recruiter / HR name"></div>
<div class="field"><label>Contacted date</label><input id="contacted" type="date"></div>
</div>
<div class="grid2">
<div class="field"><label>Recruiter email</label><input id="email" type="email" placeholder="name@company.com"></div>
<div class="field"><label>Recruiter phone</label><input id="phone" type="tel" placeholder="+91..."></div>
</div>
<div class="field"><label>Job URL</label><input id="url" type="url" placeholder="https://..."></div>
<div class="field"><label>Notes</label><textarea id="notes" rows="3" placeholder="Interview details, follow-up notes, salary, etc."></textarea></div>
<div class="actions"><button onclick="saveApp()">Save</button><button class="secondary" onclick="closeForm()">Cancel</button></div>
</section>

<section id="list"></section>
</main>
<div class="bottom"><button onclick="openForm()">＋ Add Job Application</button></div>
<script>
const statuses=["Applied","Application Viewed","Shortlisted","Recruiter Contacted","Interview","Assessment","Offer","Rejected","Withdrawn"];
const $=id=>document.getElementById(id);
let apps=JSON.parse(localStorage.getItem("jobTrackerApps")||"[]");
function today(){return new Date().toISOString().slice(0,10)}
function fmt(d){if(!d)return "—";const p=d.split("-");return p.length===3?`${p[2]} ${new Date(d).toLocaleString("en-IN",{month:"short"})} ${p[0]}`:d}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function attr(s){return esc(s).replace(/`/g,"&#96;")}
function fill(){
 $("status").innerHTML=statuses.map(s=>`<option>${s}</option>`).join("");
 $("filter").innerHTML='<option value="">All statuses</option>'+statuses.map(s=>`<option>${s}</option>`).join("");
}
function save(){localStorage.setItem("jobTrackerApps",JSON.stringify(apps))}
function render(){
 $("total").textContent=apps.length;$("interviews").textContent=apps.filter(a=>a.status==="Interview").length;$("offers").textContent=apps.filter(a=>a.status==="Offer").length;$("rejected").textContent=apps.filter(a=>a.status==="Rejected").length;
 const q=$("search").value.toLowerCase().trim(), f=$("filter").value, sf=$("sourceFilter").value;
 const list=apps.filter(a=>(!q||`${a.company} ${a.role} ${a.recruiter||""}`.toLowerCase().includes(q))&&(!f||a.status===f)&&(!sf||a.source===sf));
 $("list").innerHTML=list.length?list.map(card).join(""):'<div class="empty">No applications found.<br>Add your first application above.</div>';
}
function card(a){
 const events=(a.history||[]).slice().reverse().map(e=>`<div class="event"><strong>${esc(e.status)}</strong><small>${fmt(e.date)}</small></div>`).join("");
 return `<article class="app"><div class="app-head"><div><div class="company">${esc(a.company)}</div><div class="role">${esc(a.role||"Job application")}</div><div class="muted">${esc(a.source)} · Applied ${fmt(a.applied)}</div></div><span class="pill">${esc(a.status)}</span></div>
 ${a.location?`<div class="muted">📍 ${esc(a.location)}</div>`:""}
 ${a.recruiter?`<div class="contact"><b>Recruiter</b><div>${esc(a.recruiter)}${a.contacted?` · Contacted ${fmt(a.contacted)}`:""}</div><div class="contact-row">${a.email?`<a href="mailto:${attr(a.email)}">✉ Email</a>`:""}${a.phone?`<a href="tel:${attr(a.phone)}">📞 Call</a>`:""}</div></div>`:""}
 <details class="details"><summary>View details</summary><div class="timeline">${events||'<div class="small">No status history yet.</div>'}</div>${a.notes?`<p class="small">📝 ${esc(a.notes)}</p>`:""}${a.url?`<p><a href="${attr(a.url)}" target="_blank" rel="noopener">Open job posting ↗</a></p>`:""}<div class="grid2"><select onchange="changeStatus('${a.id}',this.value)">${statuses.map(s=>`<option ${s===a.status?'selected':''}>${s}</option>`).join("")}</select><button class="danger" onclick="removeApp('${a.id}')">Delete</button></div></details></article>`;
}
function openForm(){
 $("form").style.display="block";$("formTitle").textContent="Add application";$("applied").value=today();$("status").value="Applied";window.scrollTo({top:0,behavior:"smooth"});
}
function closeForm(){$("form").style.display="none"}
function saveApp(){
 if(!$("company").value.trim()){alert("Please enter the company name.");return}
 const id=crypto.randomUUID();const status=$("status").value;apps.unshift({id,company:$("company").value.trim(),role:$("role").value.trim(),source:$("source").value,status,applied:$("applied").value||today(),location:$("location").value.trim(),recruiter:$("recruiter").value.trim(),contacted:$("contacted").value,email:$("email").value.trim(),phone:$("phone").value.trim(),url:$("url").value.trim(),notes:$("notes").value.trim(),history:[{status,date:$("applied").value||today()}]});
 ["company","role","location","recruiter","contacted","email","phone","url","notes"].forEach(x=>$(x).value="");save();closeForm();render();
}
function changeStatus(id,status){const a=apps.find(x=>x.id===id);if(!a)return;if(a.status!==status){a.status=status;a.history=a.history||[];a.history.push({status,date:today()});save();render()}}
function removeApp(id){if(confirm("Delete this application?")){apps=apps.filter(a=>a.id!==id);save();render()}}
$("search").oninput=render;$("filter").onchange=render;$("sourceFilter").onchange=render;fill();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
