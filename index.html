<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#111827"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="default"
>

<meta
  name="apple-mobile-web-app-title"
  content="Job Tracker"
>

<link
  rel="manifest"
  href="manifest.webmanifest"
>

<title>Job Tracker</title>


<style>

/* =====================================================
   BASE
===================================================== */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background:#f6f7f9;
  color:#111827;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  border:0;
  border-radius:12px;
  padding:11px 14px;
  background:#111827;
  color:#fff;
  font-weight:650;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.secondary{
  background:#eef0f3;
  color:#111827;
}

.danger{
  background:#fee2e2;
  color:#991b1b;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.blue{
  background:#dbeafe;
  color:#1d4ed8;
}


/* =====================================================
   HEADER
===================================================== */

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  padding:14px 16px;
  border-bottom:1px solid #e5e7eb;

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

h1{
  margin:0;
  font-size:23px;
}

.sub{
  margin-top:3px;
  color:#6b7280;
  font-size:12px;
}


/* =====================================================
   MAIN
===================================================== */

main{
  max-width:820px;
  margin:auto;
  padding:14px 14px 110px;
}


/* =====================================================
   NOTICE
===================================================== */

.notice{
  background:#eef6ff;
  border:1px solid #d8eaff;
  color:#1e40af;
  border-radius:13px;
  padding:11px 12px;
  font-size:12px;
  margin-bottom:12px;
}


/* =====================================================
   ACCOUNT
===================================================== */

.account{
  display:none;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:17px;
  padding:15px;
  margin-bottom:12px;
}

.account h2{
  margin:0 0 10px;
  font-size:18px;
}

.account-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.status-dot{
  font-size:12px;
  color:#166534;
}

.small{
  font-size:11px;
  color:#6b7280;
}

.sync-loading{
  margin-top:8px;
  font-size:11px;
  color:#374151;
}


/* =====================================================
   STATS
===================================================== */

.stats{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:8px;
  margin:2px 0 14px;
}

.stat{
  background:#fff;
  border-radius:15px;
  padding:12px 5px;
  text-align:center;
  border:1px solid #eceef1;
}

.num{
  font-size:20px;
  font-weight:750;
}

.label{
  font-size:11px;
  color:#6b7280;
  margin-top:2px;
}


/* =====================================================
   ACTION SUMMARY
===================================================== */

.action-box{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:17px;
  padding:14px;
  margin-bottom:12px;
}

.action-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.action-title{
  font-size:16px;
  font-weight:750;
}

.action-count{
  background:#111827;
  color:#fff;
  border-radius:999px;
  padding:4px 8px;
  font-size:11px;
  font-weight:700;
}

.action-list{
  margin-top:10px;
}

.action-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  padding:10px 0;
  border-top:1px solid #eef0f2;
}

.action-item:first-child{
  border-top:0;
}

.action-company{
  font-weight:700;
  font-size:13px;
}

.action-role{
  font-size:12px;
  color:#4b5563;
  margin-top:2px;
}

.action-reason{
  font-size:11px;
  color:#6b7280;
  margin-top:3px;
}

.action-buttons{
  display:flex;
  gap:5px;
  flex-shrink:0;
}

.action-buttons button{
  padding:7px 9px;
  font-size:11px;
}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar{
  display:flex;
  gap:8px;
  margin-bottom:9px;
}

.toolbar>*:first-child{
  flex:1;
}

input,
select,
textarea{
  width:100%;
  padding:11px 12px;
  border:1px solid #d7dbe0;
  border-radius:11px;
  background:#fff;
  color:#111827;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#9ca3af;
}


/* =====================================================
   FORM
===================================================== */

.form{
  display:none;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:17px;
  padding:16px;
  margin:12px 0;
}

.form h2{
  margin:0 0 14px;
  font-size:20px;
}

.field{
  margin-bottom:10px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:650;
  color:#4b5563;
  margin:0 0 5px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.grid3{
  display:grid;
  grid-template-columns:
    1fr 1fr 1fr;
  gap:9px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:5px;
}

.actions>*{
  flex:1;
}


/* =====================================================
   APPLICATION CARD
===================================================== */

.app{
  background:#fff;
  border:1px solid #e7e9ec;
  border-radius:17px;
  padding:15px;
  margin:10px 0;
}

.app-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.company{
  font-size:17px;
  font-weight:750;
}

.role{
  font-size:14px;
  margin-top:2px;
}

.muted{
  color:#6b7280;
  font-size:12px;
  margin-top:4px;
}

.pill{
  display:inline-block;
  border-radius:999px;
  padding:5px 9px;
  background:#eef2ff;
  color:#3730a3;
  font-size:11px;
  font-weight:650;
  white-space:nowrap;
  height:max-content;
}


/* =====================================================
   STATUS COLORS
===================================================== */

.pill.applied{
  background:#eef2ff;
  color:#3730a3;
}

.pill.interview{
  background:#dcfce7;
  color:#166534;
}

.pill.offer{
  background:#fef3c7;
  color:#92400e;
}

.pill.rejected{
  background:#fee2e2;
  color:#991b1b;
}

.pill.shortlisted{
  background:#dbeafe;
  color:#1d4ed8;
}

.pill.assessment{
  background:#f3e8ff;
  color:#7e22ce;
}


/* =====================================================
   CONTACT
===================================================== */

.contact{
  margin-top:12px;
  padding-top:11px;
  border-top:1px solid #eef0f2;
  font-size:13px;
}

.contact a{
  color:#111827;
  text-decoration:none;
}

.contact-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:6px;
}

.contact-row a,
.contact-row span{
  background:#f4f5f6;
  border-radius:9px;
  padding:7px 9px;
}


/* =====================================================
   DETAILS
===================================================== */

.details{
  margin-top:10px;
}

.details summary{
  font-size:13px;
  font-weight:650;
  cursor:pointer;
}


/* =====================================================
   TIMELINE
===================================================== */

.timeline{
  margin:10px 0 0 4px;
  border-left:2px solid #e5e7eb;
  padding-left:12px;
}

.event{
  margin:0 0 13px;
  position:relative;
}

.event:before{
  content:"";
  position:absolute;
  left:-18px;
  top:4px;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#111827;
}

.event strong{
  font-size:12px;
}

.event small{
  display:block;
  color:#6b7280;
  margin-top:2px;
}

.event-source{
  display:inline-block;
  margin-top:3px;
  font-size:10px;
  color:#6b7280;
}


/* =====================================================
   EMPTY
===================================================== */

.empty{
  text-align:center;
  color:#6b7280;
  padding:42px 15px;
}


/* =====================================================
   BOTTOM BUTTON
===================================================== */

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(12px);
  border-top:1px solid #e5e7eb;
  padding:
    10px
    14px
    calc(10px + env(safe-area-inset-bottom));
  z-index:30;
}

.bottom button{
  width:100%;
}


/* =====================================================
   RESULTS BAR
===================================================== */

.results-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 2px;
}

.results-count{
  font-size:11px;
  color:#6b7280;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .stats{
    grid-template-columns:
      repeat(2,1fr);
  }

  .grid2{
    grid-template-columns:1fr;
  }

  .grid3{
    grid-template-columns:1fr;
  }

  .account-row{
    align-items:flex-start;
    flex-direction:column;
  }

  .action-item{
    align-items:flex-start;
    flex-direction:column;
  }

  .action-buttons{
    width:100%;
  }

  .action-buttons button{
    flex:1;
  }

}

@media(max-width:430px){

  .stats{
    gap:6px;
  }

  .stat{
    padding:11px 2px;
  }

  header button{
    padding:9px 10px;
  }

  .app-head{
    align-items:flex-start;
  }

  .toolbar{
    flex-direction:column;
  }

}

</style>

</head>

     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>

/* =====================================================
   STATUS LIST
===================================================== */

const statuses = [

  "Applied",

  "Application Viewed",

  "Shortlisted",

  "Recruiter Contacted",

  "Interview",

  "Assessment",

  "Offer",

  "Rejected",

  "Withdrawn"

];


/* =====================================================
   HELPERS
===================================================== */

const $ =
  id =>
    document.getElementById(id);


let apps =
  JSON.parse(
    localStorage.getItem(
      "jobTrackerApps"
    ) || "[]"
  );


let sb = null;

let currentSession = null;

let gmailConnected = false;

let editingId = null;


/* =====================================================
   TODAY
===================================================== */

function today(){

  return new Date()
    .toISOString()
    .slice(0,10);

}


/* =====================================================
   DATE FORMAT
===================================================== */

function fmt(value){

  if(!value){

    return "—";

  }

  const d =
    new Date(value);

  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    const parts =
      String(value)
        .split("-");

    if(
      parts.length === 3
    ){

      return `
        ${parts[2]}
        ${parts[1]}
        ${parts[0]}
      `;

    }

    return value;

  }

  return d.toLocaleDateString(
    "en-IN",
    {
      day:"2-digit",
      month:"short",
      year:"numeric"
    }
  );

}


/* =====================================================
   DATE TIME
===================================================== */

function fmtDateTime(value){

  if(!value){

    return "—";

  }

  const d =
    new Date(value);

  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return fmt(value);

  }

  return d.toLocaleString(
    "en-IN",
    {
      day:"2-digit",
      month:"short",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =====================================================
   ESCAPE
===================================================== */

function esc(s){

  return String(
    s ?? ""
  )
  .replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );

}


function attr(s){

  return esc(s)
    .replace(
      /`/g,
      "&#96;"
    );

}


/* =====================================================
   STATUS CLASS
===================================================== */

function statusClass(status){

  const value =
    String(
      status || ""
    )
    .toLowerCase();

  if(
    value === "interview"
  ){

    return "interview";

  }

  if(
    value === "offer"
  ){

    return "offer";

  }

  if(
    value === "rejected"
  ){

    return "rejected";

  }

  if(
    value === "shortlisted"
  ){

    return "shortlisted";

  }

  if(
    value === "assessment"
  ){

    return "assessment";

  }

  return "applied";

}


/* =====================================================
   FILL SELECTS
===================================================== */

function fill(){

  $("status").innerHTML =
    statuses
      .map(
        s =>
          `<option>${esc(s)}</option>`
      )
      .join("");


  $("filter").innerHTML =
    `<option value="">
      All statuses
    </option>` +

    statuses
      .map(
        s =>
          `<option value="${attr(s)}">
            ${esc(s)}
          </option>`
      )
      .join("");

}


/* =====================================================
   LOCAL SAVE
===================================================== */

function save(){

  localStorage.setItem(
    "jobTrackerApps",
    JSON.stringify(apps)
  );

}


/* =====================================================
   ACTION NEEDED
===================================================== */

function getActionApps(){

  const now =
    new Date();

  return apps
    .filter(a => {

      if(
        a.status === "Rejected" ||
        a.status === "Offer" ||
        a.status === "Withdrawn"
      ){

        return false;

      }

      const reference =
        a.contacted ||
        a.applied;

      if(!reference){

        return false;

      }

      const d =
        new Date(reference);

      if(
        Number.isNaN(
          d.getTime()
        )
      ){

        return false;

      }

      const days =
        (
          now.getTime() -
          d.getTime()
        ) /
        86400000;

      /*
       * Show applications
       * older than 3 days
       * without an interview.
       */

      return (
        days >= 3 &&
        a.status !== "Interview"
      );

    })
    .sort(
      (a,b) =>
        new Date(
          a.contacted ||
          a.applied ||
          0
        ) -
        new Date(
          b.contacted ||
          b.applied ||
          0
        )
    )
    .slice(0,5);

}


/* =====================================================
   RENDER ACTION BOX
===================================================== */

function renderActions(){

  const actionApps =
    getActionApps();


  $("actionCount")
    .textContent =
      actionApps.length;


  if(
    actionApps.length === 0
  ){

    $("actionList").innerHTML = `

      <div
        class="small"
        style="padding-top:8px"
      >
        ✅ No urgent follow-ups right now.
      </div>

    `;

    return;

  }


  $("actionList").innerHTML =
    actionApps
      .map(a => {

        const reference =
          a.contacted ||
          a.applied;

        const days =
          Math.floor(
            (
              new Date()
                .getTime() -
              new Date(reference)
                .getTime()
            ) /

/* =====================================================
   RENDER DASHBOARD
===================================================== */

function render(){

  $("total")
    .textContent =
      apps.length;


  $("interviews")
    .textContent =
      apps.filter(
        a =>
          a.status ===
          "Interview"
      ).length;


  $("offers")
    .textContent =
      apps.filter(
        a =>
          a.status ===
          "Offer"
      ).length;


  $("rejected")
    .textContent =
      apps.filter(
        a =>
          a.status ===
          "Rejected"
      ).length;


  renderActions();


  const q =
    $("search")
      .value
      .toLowerCase()
      .trim();


  const f =
    $("filter")
      .value;


  const sf =
    $("sourceFilter")
      .value;


  const sort =
    $("sortFilter")
      .value;


  let list =
    apps.filter(a => {

      const searchable =
        `${a.company}
         ${a.role || ""}
         ${a.recruiter || ""}
         ${a.email || ""}
         ${a.location || ""}`
          .toLowerCase();


      return (

        (
          !q ||
          searchable.includes(q)
        )

        &&

        (
          !f ||
          a.status === f
        )

        &&

        (
          !sf ||
          a.source === sf
        )

      );

    });


  if(
    sort === "company"
  ){

    list.sort(
      (a,b) =>
        String(
          a.company || ""
        ).localeCompare(
          String(
            b.company || ""
          )
        )
    );

  }else{

    list.sort(
      (a,b) => {

        const da =
          new Date(
            a.applied ||
            a.contacted ||
            0
          ).getTime();

        const db =
          new Date(
            b.applied ||
            b.contacted ||
            0
          ).getTime();


        return sort === "oldest"
          ? da - db
          : db - da;

      }
    );

  }


  $("resultsCount")
    .textContent =
      `${list.length} application${list.length === 1 ? "" : "s"}`;


  $("list").innerHTML =
    list.length
      ? list
          .map(card)
          .join("")
      : `

        <div class="empty">

          No applications found.

          <br><br>

          <button
            onclick="openForm()"
          >
            ＋ Add Application
          </button>

        </div>

      `;

}


/* =====================================================
   APPLICATION CARD
===================================================== */

function card(a){

  const events =
    (a.history || [])
      .slice()
      .sort(
        (x,y) =>
          new Date(
            x.date || 0
          ) -
          new Date(
            y.date || 0
          )

      .map(e => `

        <div class="event">

          <strong>
            ${esc(
              e.status ||
              "Status update"
            )}
          </strong>

          <small>
            ${fmtDateTime(e.date)}
          </small>

          ${
            e.source
              ? `
                <span
                  class="event-source"
                >
                  Source:
                  ${esc(e.source)}
                </span>
              `
              : ""
          }

        </div>

      .join("");


  const hasContact =
    a.recruiter ||
    a.email ||
    a.phone;


  const cls =
    statusClass(
      a.status
    );


  return `

    <article class="app">

      <div class="app-head">

        <div>

          <div class="company">
            ${esc(a.company)}
          </div>

          <div class="role">
            ${esc(
              a.role ||
              "Job application"
            )}
          </div>

          <div class="muted">

            ${esc(
              a.source ||
              "Other"
            )}

            · Applied
            ${fmt(a.applied)}

          </div>

        </div>


        <span
          class="pill ${cls}"
        >
          ${esc(
            a.status ||
            "Applied"
          )}
        </span>

      </div>


      ${
        a.location
          ? `
            <div class="muted">
              📍 ${esc(a.location)}
            </div>
          `
          : ""
      }


      ${
        hasContact
          ? `

            <div class="contact">

              <b>
                Recruiter
              </b>

              <div>

                ${esc(
                  a.recruiter ||
                  "—"
                )}

                ${
                  a.contacted
                    ? `
                      · Contacted
                      ${fmt(
                        a.contacted
                      )}
                    `
                    : ""
                }

              </div>


              <div class="contact-row">

                ${
                  a.email
                    ? `
                      <a
                        href="mailto:${attr(a.email)}"
                      >
                        ✉ Email
                      </a>
                    `
                    : ""
                }


                ${
                  a.phone
                    ? `
                      <a
                        href="tel:${attr(a.phone)}"
                      >
                        📞
                        ${esc(a.phone)}
                      </a>
                    `
                    : ""
                }

              </div>

            </div>

          `
          : ""
      }


      <details
        class="details"
      >

        <summary>
          View details & status history
        </summary>


        <div class="timeline">

          ${
            events ||
            `
              <div class="small">
                No status history yet.
              </div>
            `
          }

        </div>


        ${
          a.notes
            ? `
              <p class="small">
                📝 ${esc(a.notes)}
              </p>
            `
            : ""
        }


        ${
          a.url
            ? `
              <p>

                <a
                  href="${attr(a.url)}"
                  target="_blank"
                  rel="noopener"
                >
                  Open job posting ↗
                </a>

              </p>
            `
            : ""
        }


        <div class="grid3">

          <select
            onchange="
              changeStatus(
                '${attr(a.id)}',
                this.value
              )
            "
          >

            ${

                .map(
                  s =>
                    `<option
                      ${
                        s === a.status
                          ? "selected"
                          : ""
                      }
                    >
                      ${esc(s)}
                    </option>`
                )
                .join("")

          </select>


          <button
            class="secondary"
            onclick="

/* =====================================================
   SAVE APPLICATION
===================================================== */

async function saveApp(){

  if(
    !$("company")
      .value
      .trim()
  ){

    alert(
      "Please enter the company name."
    );

    return;

  }


  const status =
    $("status").value;


  const payload = {

    company:
      $("company")
        .value
        .trim(),

    role:
      $("role")
        .value
        .trim(),

    source:
      $("source")
        .value,

    status,

    applied:
      $("applied")
        .value ||
      today(),

    location:
      $("location")
        .value
        .trim(),

    recruiter:
      $("recruiter")
        .value
        .trim(),

    contacted:
      $("contacted")
        .value,

    email:
      $("email")
        .value
        .trim(),

    phone:
      $("phone")
        .value
        .trim(),

    url:
      $("url")
        .value
        .trim(),

    notes:
      $("notes")
        .value
        .trim()

  };


  /* =================================================
     EDIT
  ================================================= */

  if(editingId){

    const idx =
      apps.findIndex(
        a =>
          a.id ===
          editingId
      );


    if(idx === -1){

      alert(
        "Application not found."
      );

      return;

    }


    const old =
      apps[idx];


    const statusChanged =
      old.status !==
      status;


    apps[idx] = {

      ...old,

      ...payload,

      history:
        old.history || []

    };


    save();


    if(
      statusChanged &&
      sb &&
      currentSession
    ){

      const {
        error
      } =
        await sb
          .from(
            "application_events"
          )
          .insert({

            application_id:
              editingId,

            user_id:
              currentSession
                .user.id,

            event_type:
              status,

            event_date:
              new Date()
                .toISOString(),

            details:{
              source:
                "manual"
            }

          });


      if(error){

        console.error(
          "Status event insert error:",
          error
        );

      }

    }


    if(
      sb &&
      currentSession
    ){

      const {
        error
      } =
        await sb
          .from(
            "applications"
          )
          .update({

            company:
              payload.company,

            role:
              payload.role,

            source:
              payload.source,

            status:
              payload.status,

            applied_date:
              payload.applied,

            location:
              payload.location,

            recruiter_name:
              payload.recruiter,

            contacted_date:
              payload.contacted ||
              null,

            recruiter_email:
              payload.email,

            recruiter_phone:
              payload.phone,

            job_url:
              payload.url,

            notes:
              payload.notes

          })
          .eq(
            "id",
            editingId
          )
          .eq(
            "user_id",
            currentSession
              .user.id
          );


      if(error){

        console.error(
          "Update application error:",
          error
        );

      }

    }

  }


  /* =================================================
     CREATE
  ================================================= */

  else{

    let newId =
      crypto.randomUUID();


    if(
      sb &&
      currentSession
    ){

      const {
        data,
        error
      } =
        await sb
          .from(
            "applications"
          )
          .insert({

            user_id:
              currentSession
                .user.id,

            company:
              payload.company,

            role:
              payload.role,

            source:
              payload.source,

            status:
              payload.status,

            applied_date:
              payload.applied,

            location:
              payload.location,

            recruiter_name:
              payload.recruiter,

            contacted_date:
              payload.contacted ||
              null,

            recruiter_email:
              payload.email,

            recruiter_phone:
              payload.phone,

            job_url:
              payload.url,

            notes:
              payload.notes

          })
          .select()
          .single();


      if(error){

        console.error(
          "Insert application error:",
          error
        );

        alert(
          "Could not save the application to the cloud. Please try again."
        );

        return;

      }


      if(data){

        newId =
          data.id;

      }


      const {
        error:eventError
      } =
        await sb
          .from(
            "application_events"
          )
          .insert({

            application_id:
              newId,

            user_id:
              currentSession
                .user.id,

            event_type:
              payload.status,

            event_date:
              new Date(
                payload.applied ||
                today()
              ).toISOString(),

            details:{
              source:
                "manual"
            }

          });


      if(eventError){

        console.error(
          "Initial event error:",
          eventError
        );

      }

    }


    apps.unshift({

      id:
        newId,

      ...payload,

      history:[

        {

          status:
            payload.status,

          date:
            payload.applied,

          source:
            "manual"

        }

      ]

    });

  }


  save();

  closeForm();

  render();

}


/* =====================================================
   CHANGE STATUS
===================================================== */

async function changeStatus(
  id,
  status
){

  const a =
    apps.find(
      x =>
        x.id === id
    );


  if(!a){

    return;

  }


  if(
    a.status === status
  ){

    return;

  }


  const oldStatus =
    a.status;


  a.status =
    status;


  a.history =
    a.history || [];


  a.history.push({

    status,

    date:
      new Date()
        .toISOString(),

    source:
      "manual"

  });


  save();

  render();


  if(
    sb &&
    currentSession
  ){

    const {
      error:updateError
    } =
      await sb
        .from(
          "applications"
        )
        .update({
          status
        })
        .eq(
          "id",
          id
        )
        .eq(
          "user_id",
          currentSession
            .user.id
        );


    if(updateError){

      console.error(
        "Update status error:",
        updateError
      );


      a.status =
        oldStatus;


      a.history =
        a.history.filter(
          e =>
            !(
              e.status ===
                status &&
              e.source ===
                "manual"
            )
        );


      save();

      render();


      alert(
        "Could not update the cloud status. Please try again."
      );

      return;

    }


    const {
      error:eventError
    } =
      await sb
        .from(
          "application_events"
        )
        .insert({

          application_id:
            id,

          user_id:
            currentSession
              .user.id,

          event_type:
            status,

          event_date:
            new Date()
              .toISOString(),

          details:{

            source:
              "manual",

            previous_status:
              oldStatus

          }

        });


    if(eventError){

      console.error(
        "Status event error:",
        eventError
      );

    }

  }

}


/* =====================================================
   DELETE
===================================================== */

async function removeApp(
  id
){

  if(
    !confirm(
      "Delete this application?"
    )
  ){

    return;

  }


  const previous =
    apps.find(
      a =>
        a.id === id
    );


  apps =
    apps.filter(
      a =>
        a.id !== id
    );


  save();

  render();


  if(
    sb &&
    currentSession
  ){

    const {
      error
    } =
      await sb
        .from(
          "applications"
        )
        .delete()
        .eq(
          "id",
          id
        )
        .eq(
          "user_id",
          currentSession
            .user.id
        );


    if(error){

      console.error(
        "Delete application error:",
        error
      );


      if(previous){

        apps.unshift(
          previous
        );

        save();

        render();

      }


      alert(
        "Could not delete the application from the cloud."
      );

    }

  }

}

/* =====================================================
   LOAD CLOUD APPLICATIONS
===================================================== */

async function loadCloudApplications(){

  if(
    !sb ||
    !currentSession
  ){

    return;

  }


  const {
    data,
    error
  } =
    await sb
      .from(
        "applications"
      )
      .select("*")
      .eq(
        "user_id",
        currentSession
          .user.id
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(
      "Load applications error:",
      error
    );

    return;

  }


  const {
    data:eventData,
    error:eventError
  } =
    await sb
      .from(
        "application_events"
      )
      .select("*")
      .eq(
        "user_id",
        currentSession
          .user.id
      )
      .order(
        "event_date",
        {
          ascending:true
        }
      );


  if(eventError){

    console.error(
      "Load application events error:",
      eventError
    );

  }


  const eventsByApplication =
    {};


  (
    eventData || []
  )
  .forEach(
    event => {

      if(
        !eventsByApplication[
          event.application_id
        ]
      ){

        eventsByApplication[
          event.application_id
        ] = [];

      }


      eventsByApplication[
        event.application_id
      ].push({

        status:
          event.event_type ||
          "Status update",

        date:
          event.event_date,

        source:
          event.details?.source ||
          "system"

      });

    }
  );


  apps =
    (
      data || []
    )
    .map(
      a => {

        let history =
          eventsByApplication[
            a.id
          ] || [];


        if(
          history.length === 0 &&
          a.applied_date
        ){

          history = [

            {

              status:
                "Applied",

              date:
                a.applied_date,

              source:
                "legacy"

            }

          ];

        }


        return {

          id:
            a.id,

          company:
            a.company,

          role:
            a.role,

          source:
            a.source,

          status:
            a.status,

          applied:
            a.applied_date,

          location:
            a.location,

          recruiter:
            a.recruiter_name,

          contacted:
            a.contacted_date,

          email:
            a.recruiter_email,

          phone:
            a.recruiter_phone,

          url:
            a.job_url,

          notes:
            a.notes,

          history

        };

      }
    );


  save();

}


/* =====================================================
   AUTH
===================================================== */

function showAuth(){

  if(!configured()){

    $("authArea").innerHTML = `

      <div class="small">

        Supabase is not configured
        in this build yet.

        Add the Publishable Key to
        <b>supabase-config.js</b>.

      </div>

    `;

    return;

  }


  if(!sb){

    sb =
      window
        .supabase
        .createClient(

          window
            .JOB_TRACKER_SUPABASE
            .url,

          window
            .JOB_TRACKER_SUPABASE
            .publishableKey,

          {

            auth:{

              persistSession:
                true,

              autoRefreshToken:
                true,

              detectSessionInUrl:
                true

            }

          }

        );

  }


  sb.auth
    .getSession()
    .then(
      async ({
        data
      }) => {

        currentSession =
          data.session;

        updateAuthUI();

      }
    );


  sb.auth
    .onAuthStateChange(
      async (
        event,
        session
      ) => {

        currentSession =
          session;


        gmailConnected =
          !!(
            session &&
            session.provider_token
          );


        if(
          session &&
          session.provider_token
        ){

          sessionStorage.setItem(
            "jobTrackerGoogleToken",
            session.provider_token
          );

        }


        if(
          session &&
          session.provider_refresh_token
        ){

          sessionStorage.setItem(
            "jobTrackerGoogleRefreshToken",
            session.provider_refresh_token
          );

        }


        if(
          event ===
          "SIGNED_OUT"
        ){

          sessionStorage.removeItem(
            "jobTrackerGoogleToken"
          );

          sessionStorage.removeItem(
            "jobTrackerGoogleRefreshToken"
          );

        }


        updateAuthUI();

      }
    );

}

/* =====================================================
   GOOGLE CONNECT
===================================================== */

async function connectGoogle(){

  if(!configured()){

    alert(
      "First add the Supabase Publishable Key to supabase-config.js in GitHub."
    );

    return;

  }


  const {
    error
  } =
    await sb.auth
      .signInWithOAuth({

        provider:
          "google",

        options:{

          scopes:
            "openid email profile https://www.googleapis.com/auth/gmail.readonly",

          queryParams:{

            access_type:
              "offline",

            prompt:
              "consent"

          },

          redirectTo:
            window.location.href

        }

      });


  if(error){

    alert(
      error.message
    );

  }

}

}


/* =====================================================
   GMAIL SYNC
===================================================== */

async function syncGmail(){

  const result =
    $("syncResult");


  if(result){

    result.innerHTML =
      "⏳ Scanning Gmail...";

  }


  try{

    const {
      data,
      error:sessionError
    } =
      await sb.auth
        .getSession();


    if(sessionError){

      throw sessionError;

    }


    if(
      !data.session
    ){

      throw new Error(
        "Please connect Gmail again."
      );

    }


    const gmailAccessToken =
      data.session
        .provider_token;


    if(!gmailAccessToken){

      throw new Error(
        "Gmail access token is unavailable. Please disconnect and reconnect Gmail."
      );

    }


    const response =
      await fetch(

        "https://kmupwiaesqrmzdgfzedr.supabase.co/functions/v1/sync-gmail",

        {

          method:
            "POST",

          headers:{

            "Authorization":
              `Bearer ${data.session.access_token}`,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              gmailAccessToken:
                gmailAccessToken

            })

        }

      );


    const json =
      await response.json();


    if(!response.ok){

      throw new Error(

        json.error ||
        json.details ||
        "Gmail sync failed."

      );

    }


    if(result){

      result.innerHTML = `

        ✅ Gmail Sync Complete

        <br>

        Emails scanned:
        <b>
          ${json.scanned || 0}
        </b>

        <br>

        New applications:
        <b>
          ${json.newApplications || 0}
        </b>

        <br>

        Updated applications:
        <b>
          ${json.updatedApplications || 0}
        </b>

      `;

    }


    await loadCloudApplications();

    fill();

    render();


  }catch(error){

    console.error(
      "Gmail Sync Error:",
      error
    );


    if(result){

      result.innerHTML =
        `❌ ${esc(
          error.message ||
          "Gmail sync failed."
        )}`;

    }

  }

}
