<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Job Tracker">

<link rel="manifest" href="manifest.webmanifest">

<title>Job Tracker Pro</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f6f7f9;
  color:#111827;
}

button,input,select,textarea{
  font:inherit;
}

button{
  border:0;
  border-radius:12px;
  padding:11px 14px;
  background:#111827;
  color:#fff;
  font-weight:650;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.secondary{
  background:#eef0f3;
  color:#111827;
}

.danger{
  background:#fee2e2;
  color:#991b1b;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.warning{
  background:#fef3c7;
  color:#92400e;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(14px);
  padding:13px 16px;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

h1{
  margin:0;
  font-size:22px;
}

.sub{
  margin-top:3px;
  color:#6b7280;
  font-size:12px;
}

main{
  max-width:900px;
  margin:auto;
  padding:14px 14px 110px;
}

.notice{
  background:#eef6ff;
  border:1px solid #d8eaff;
  color:#1e40af;
  border-radius:13px;
  padding:11px 12px;
  font-size:12px;
  margin-bottom:12px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin:2px 0 14px;
}

.stat{
  background:#fff;
  border-radius:15px;
  padding:12px 5px;
  text-align:center;
  border:1px solid #eceef1;
}

.num{
  font-size:20px;
  font-weight:750;
}

.label{
  font-size:11px;
  color:#6b7280;
  margin-top:2px;
}

.insights{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:14px;
}

.insight{
  background:#fff;
  border:1px solid #e7e9ec;
  border-radius:15px;
  padding:13px;
}

.insight-title{
  font-size:11px;
  color:#6b7280;
}

.insight-value{
  font-size:16px;
  font-weight:750;
  margin-top:4px;
}

.toolbar{
  display:flex;
  gap:8px;
  margin-bottom:9px;
}

.toolbar>*:first-child{
  flex:1;
}

input,select,textarea{
  width:100%;
  padding:11px 12px;
  border:1px solid #d7dbe0;
  border-radius:11px;
  background:#fff;
  color:#111827;
  outline:none;
}

input:focus,select:focus,textarea:focus{
  border-color:#9ca3af;
}

.form{
  display:none;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:17px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 4px 18px rgba(0,0,0,.04);
}

.form h2{
  margin:0 0 14px;
  font-size:20px;
}

.field{
  margin-bottom:10px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:650;
  color:#4b5563;
  margin:0 0 5px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.grid3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:6px;
}

.actions>*{
  flex:1;
}

.app{
  background:#fff;
  border:1px solid #e7e9ec;
  border-radius:17px;
  padding:15px;
  margin:10px 0;
  box-shadow:0 2px 10px rgba(0,0,0,.025);
}

.app.overdue{
  border-left:4px solid #dc2626;
}

.app.today{
  border-left:4px solid #d97706;
}

.app-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.company{
  font-size:17px;
  font-weight:750;
}

.role{
  font-size:14px;
  margin-top:2px;
}

.muted{
  color:#6b7280;
  font-size:12px;
  margin-top:4px;
}

.pill{
  display:inline-block;
  border-radius:999px;
  padding:5px 9px;
  background:#eef2ff;
  color:#3730a3;
  font-size:11px;
  font-weight:650;
  white-space:nowrap;
  height:max-content;
}

.priority{
  display:inline-block;
  border-radius:999px;
  padding:4px 8px;
  font-size:10px;
  font-weight:700;
  margin-top:6px;
}

.priority-high{
  background:#fee2e2;
  color:#991b1b;
}

.priority-medium{
  background:#fef3c7;
  color:#92400e;
}

.priority-low{
  background:#dcfce7;
  color:#166534;
}

.followup{
  margin-top:11px;
  background:#f8fafc;
  border-radius:11px;
  padding:9px 10px;
  font-size:12px;
}

.followup.overdue{
  background:#fef2f2;
  color:#991b1b;
}

.followup.today{
  background:#fffbeb;
  color:#92400e;
}

.contact{
  margin-top:12px;
  padding-top:11px;
  border-top:1px solid #eef0f2;
  font-size:13px;
}

.contact a{
  color:#111827;
  text-decoration:none;
}

.contact-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:6px;
}

.contact-row a,
.contact-row span{
  background:#f4f5f6;
  border-radius:9px;
  padding:7px 9px;
}

.details{
  margin-top:10px;
}

.details summary{
  font-size:13px;
  font-weight:650;
  cursor:pointer;
}

.timeline{
  margin:10px 0 0 4px;
  border-left:2px solid #e5e7eb;
  padding-left:12px;
}

.event{
  margin:0 0 13px;
  position:relative;
}

.event:before{
  content:"";
  position:absolute;
  left:-18px;
  top:4px;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#111827;
}

.event strong{
  font-size:12px;
}

.event small{
  display:block;
  color:#6b7280;
  margin-top:2px;
}

.event-source{
  display:inline-block;
  margin-top:3px;
  font-size:10px;
  color:#6b7280;
}

.quick-status{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding:8px 0 2px;
}

.quick-status button{
  flex:0 0 auto;
  padding:7px 9px;
  font-size:10px;
}

.empty{
  text-align:center;
  color:#6b7280;
  padding:42px 15px;
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(12px);
  border-top:1px solid #e5e7eb;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  z-index:60;
}

.bottom button{
  width:100%;
}

.account{
  display:none;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:17px;
  padding:15px;
  margin-bottom:12px;
}

.account h2{
  margin:0 0 10px;
  font-size:18px;
}

.account-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.status-dot{
  font-size:12px;
  color:#166534;
}

.small{
  font-size:11px;
  color:#6b7280;
}

.sync-loading{
  margin-top:8px;
  font-size:11px;
  color:#374151;
}

.tools{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:10px 0;
}

.tools button{
  font-size:11px;
  padding:8px 10px;
}

.section-title{
  font-size:14px;
  font-weight:750;
  margin:16px 0 7px;
}

.salary-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.badge-row{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:7px;
}

.badge{
  background:#f3f4f6;
  border-radius:8px;
  padding:5px 7px;
  font-size:10px;
  color:#374151;
}

@media(max-width:600px){

  .stats{
    gap:6px;
  }

  .stat{
    padding:10px 2px;
  }

  .insights{
    grid-template-columns:1fr;
  }

  .grid2{
    grid-template-columns:1fr;
  }

  .grid3{
    grid-template-columns:1fr;
  }

  .salary-row{
    grid-template-columns:1fr;
  }

  .app-head{
    align-items:flex-start;
  }

  header button{
    padding:9px 10px;
  }
}
</style>
</head>

<body>

<header>

  <div>
    <h1>💼 Job Tracker</h1>
    <div class="sub">
      Job search command center
    </div>
  </div>

  <button
    class="secondary"
    onclick="toggleAccount()"
  >
    Account
  </button>

</header>

<main>

<div
  class="notice"
  id="notice"
>
  🔒 Applications stay on this device until cloud sync is enabled.
</div>

<section
  class="account"
  id="account"
>

  <h2>Account & Gmail</h2>

  <div id="authArea"></div>

</section>


<section class="stats">

  <div class="stat">
    <div

      id="total"
    >

    <div class="label">
      Applications
    </div>
  </div>

  <div class="stat">
    <div
      class="num"
      id="interviews"
    >
      0
    </div>

    <div class="label">
      Interviews
    </div>
  </div>

  <div class="stat">
    <div
      class="num"
      id="offers"
    >
      0
    </div>

    <div class="label">
      Offers
    </div>
  </div>

  <div class="stat">
    <div
      class="num"
      id="rejected"
    >
      0
    </div>

    <div class="label">
      Rejected
    </div>
  </div>

</section>


<section class="insights">

  <div class="insight">

    <div class="insight-title">
      🔔 Follow-ups due
    </div>

    <div
      class="insight-value"
      id="followupsDue"
    >
      0
    </div>

  </div>

  <div class="insight">

    <div class="insight-title">

    </div>

    <div
      class="insight-value"
      id="highPriority"

      0
    </div>

  </div>

  <div class="insight">

    <div class="insight-title">
      📅 Interviews upcoming
    </div>

    <div
      class="insight-value"
      id="upcomingInterviews"

      0
    </div>

  </div>

</section>


<div class="toolbar">

  <input
    id="search"
    placeholder="Search company, role or recruiter"
    autocomplete="off"
  >

  <button onclick="openForm()">
    ＋ Add
  </button>

</div>


<div class="toolbar">

  <select id="filter">

    <option value="">
      All statuses
    </option>

  </select>

  <select id="sourceFilter">

    <option value="">
      All sources
    </option>

    <option>
      LinkedIn
    </option>

    <option>
      Naukri
    </option>

    <option>
      Other
    </option>

    <option>
      Email
    </option>

  </select>

</div>


<div class="toolbar">

  <select id="priorityFilter">

    <option value="">
      All priorities
    </option>

    <option value="High">
      High
    </option>

    <option value="Medium">
      Medium
    </option>

    <option value="Low">
      Low
    </option>

  </select>


  <select id="sortBy">

    <option value="newest">
      Newest first
    </option>

    <option value="oldest">
      Oldest first
    </option>

    </option>

    <option value="interview">

</div>


<div class="tools">

    Add application

        placeholder="e.g. Cisco"

    <div class="field">

      <input

  <div class="grid2">

    <div class="field">

        Source

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>

const statuses = [

  "Applied",
  "Application Viewed",
  "Shortlisted",
  "Recruiter Contacted",
  "Interview",
  "Assessment",
  "Offer",
  "Rejected",
  "Withdrawn"

];


const $ =
  id => document.getElementById(id);


let apps =
  JSON.parse(
    localStorage.getItem(
      "jobTrackerApps"
    ) || "[]"
  );


let sb = null;

let currentSession = null;

let gmailConnected = false;

let editingId = null;


/* =========================
   BASIC HELPERS
========================= */

function today(){

  return new Date()
    .toISOString()
    .slice(0,10);

}


function nowDate(){

  return new Date();

}


function fmt(value){

  if(!value) return "—";

  const d =
    new Date(value);

  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    const parts =
      String(value).split("-");

    if(parts.length === 3){

      return `${parts[2]} ${parts[1]} ${parts[0]}`;

    }

    return value;

  }

  return d.toLocaleDateString(
    "en-IN",
    {
      day:"2-digit",
      month:"short",
      year:"numeric"
    }
  );

}


function fmtDateTime(value){

  if(!value) return "—";

  const d =
    new Date(value);

  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return fmt(value);

  }

  return d.toLocaleString(
    "en-IN",
    {
      day:"2-digit",
      month:"short",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function esc(s){

  return String(
    s ?? ""
  ).replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );

}


function attr(s){

  return esc(s)
    .replace(
      /`/g,
      "&#96;"
    );

}


function save(){

  localStorage.setItem(
    "jobTrackerApps",
    JSON.stringify(apps)
  );

}


function fill(){

  $("status").innerHTML =
    statuses
      .map(
        s =>
          `<option>${s}</option>`
      )
      .join("");


  $("filter").innerHTML =
    '<option value="">All statuses</option>' +
    statuses
      .map(
        s =>
          `<option>${s}</option>`
      )
      .join("");

}


/* =========================
   FOLLOW-UP HELPERS
========================= */

function followupState(date){

  if(!date){

    return "";

  }

  const d =
    new Date(
      date + "T00:00:00"
    );

  const t =
    new Date();

  t.setHours(
    0,0,0,0
  );


  if(d < t){

    return "overdue";

  }


  if(
    d.getTime() ===
    t.getTime()
  ){

    return "today";

  }


  return "future";

}


function followupText(date){

  const state =
    followupState(date);

  if(!state) return "";

  if(state === "overdue"){

    return `🔴 Follow-up overdue · ${fmt(date)}`;

  }

  if(state === "today"){

    return `🟠 Follow-up today · ${fmt(date)}`;

  }

  return `🔔 Follow-up · ${fmt(date)}`;

}


/* =========================
   RENDER
========================= */

function render(){

  $("total").textContent =
    apps.length;


  $("interviews").textContent =
    apps.filter(
      a =>
        a.status ===
        "Interview"
    ).length;


  $("offers").textContent =
    apps.filter(
      a =>
        a.status ===
        "Offer"
    ).length;


  $("rejected").textContent =
    apps.filter(
      a =>
        a.status ===
        "Rejected"
    ).length;


  const todayValue =
    today();


  $("followupsDue").textContent =
    apps.filter(
      a =>
        a.followup &&
        a.followup <= todayValue &&
        ![
          "Rejected",
          "Withdrawn",
          "Offer"
        ].includes(a.status)
    ).length;


  $("highPriority").textContent =
    apps.filter(
      a =>
        a.priority === "High"
    ).length;


  $("upcomingInterviews").textContent =
    apps.filter(
      a =>
        a.interviewDate &&
        new Date(
          a.interviewDate
        ) >= new Date()
    ).length;


  const q =
    $("search")
      .value
      .toLowerCase()
      .trim();


  const f =
    $("filter").value;


  const sf =
    $("sourceFilter").value;


  const pf =
    $("priorityFilter").value;


  let list =
    apps.filter(a => {

      const searchable =
        `${a.company}
         ${a.role}
         ${a.recruiter || ""}
         ${a.location || ""}
         ${a.email || ""}
         ${a.notes || ""}`
          .toLowerCase();


      return (

        (!q ||
          searchable.includes(q))

        &&

        (!f ||
          a.status === f)

        &&

        (!sf ||
          a.source === sf)

        &&

        (!pf ||
          a.priority === pf)

      );

    });


  const sort =
    $("sortBy").value;


  list.sort(
    (a,b) => {

      if(sort === "company"){

        return (
          a.company || ""
        ).localeCompare(
          b.company || ""
        );

      }


      if(sort === "oldest"){

        return (
          new Date(
            a.applied || 0
          ) -
          new Date(
            b.applied || 0
          )
        );

      }


      if(sort === "followup"){

        return (
          new Date(
            a.followup || "9999-12-31"
          ) -
          new Date(
            b.followup || "9999-12-31"
          )
        );

      }


      if(sort === "interview"){

        return (
          new Date(
            a.interviewDate ||
            "9999-12-31"
          ) -
          new Date(
            b.interviewDate ||
            "9999-12-31"
          )
        );

      }


      return (
        new Date(
          b.applied || 0
        ) -
        new Date(
          a.applied || 0
        )
      );

    }
  );


  $("list").innerHTML =
    list.length
      ? list
          .map(card)
          .join("")
      : `
        <div class="empty">

          No applications found.

          <br>

          Add your first application above.

        </div>
      `;

}

    a.recruiter ||

    a.phone;

      <div class="badge-row">

      ${

                ${esc(

                )}

                ${

   SAVE APPLICATION
========================= */

async function saveApp(){

  if(
    !$("company")
      .value
      .trim()
  ){

    alert(
      "Please enter the company name."
    );

    return;

  }


  const payload =
    getPayload();


  if(editingId){

    const idx =
      apps.findIndex(
        a =>
          a.id ===
          editingId
      );


    if(idx === -1){

      alert(
        "Application not found."
      );

      return;

    }


    const old =
      apps[idx];


    const statusChanged =
      old.status !==
      payload.status;


    apps[idx] = {

      ...old,

      ...payload,

      history:
        old.history || []

    };


    if(statusChanged){

      apps[idx].history.push({

        status:
          payload.status,

        date:
          new Date()
            .toISOString(),

        source:
          "manual"

      });

    }


    save();


    if(
      sb &&
      currentSession
    ){

      const {
        error
      } =
        await sb
          .from(
            "applications"
          )
          .update({

            company:
              payload.company,

            role:
              payload.role,

            source:
              payload.source,

            status:
              payload.status,

            applied_date:
              payload.applied,

            location:
              payload.location,

            recruiter_name:
              payload.recruiter,

            contacted_date:
              payload.contacted ||
              null,

            recruiter_email:
              payload.email,

            recruiter_phone:
              payload.phone,

            job_url:
              payload.url,

            notes:
              payload.notes,

            priority:
              payload.priority,

            followup_date:
              payload.followup ||
              null,

            interview_date:
              payload.interviewDate ||
              null,

            notice_period:
              payload.noticePeriod,

            current_ctc:
              payload.currentCtc,

            expected_ctc:
              payload.expectedCtc,

            offered_ctc:
              payload.offeredCtc

          })
          .eq(
            "id",
            editingId
          )
          .eq(
            "user_id",
            currentSession.user.id
          );


      if(error){

        console.error(
          "Cloud update error:",
          error
        );

      }


      if(statusChanged){

        await insertCloudEvent(
          editingId,
          payload.status,
          {
            source:
              "manual"
          }
        );

      }

    }

  }else{

    let newId =
      crypto.randomUUID();


    if(
      sb &&
      currentSession
    ){

      const {
        data,
        error
      } =
        await sb
          .from(
            "applications"
          )
          .insert({

            user_id:
              currentSession.user.id,

            company:
              payload.company,

            role:
              payload.role,

            source:
              payload.source,

            status:
              payload.status,

            applied_date:
              payload.applied,

            location:
              payload.location,

            recruiter_name:
              payload.recruiter,

            contacted_date:
              payload.contacted ||
              null,

            recruiter_email:
              payload.email,

            recruiter_phone:
              payload.phone,

            job_url:
              payload.url,

            notes:
              payload.notes,

            priority:
              payload.priority,

            followup_date:
              payload.followup ||
              null,

            interview_date:
              payload.interviewDate ||
              null,

            notice_period:
              payload.noticePeriod,

            current_ctc:
              payload.currentCtc,

            expected_ctc:
              payload.expectedCtc,

            offered_ctc:
              payload.offeredCtc

          })
          .select()
          .single();


      if(error){

        console.error(
          "Cloud insert error:",
          error
        );

        alert(
          "Could not save the application to the cloud. Please try again."
        );

        return;

      }


      if(data){

        newId =
          data.id;

      }


      await insertCloudEvent(
        newId,
        payload.status,
        {
          source:
            "manual"
        }
      );

    }


    apps.unshift({

      id:
        newId,

      ...payload,

      history:[

        {

          status:
            payload.status,

          date:
            new Date()
              .toISOString(),

          source:
            "manual"

        }

      ]

    });

  }


  save();

  closeForm();

  render();

}


/* =========================
   CLOUD EVENT
========================= */

async function insertCloudEvent(
  applicationId,
  status,
  details={}
){

  if(
    !sb ||
    !currentSession
  ){

    return;

  }


  const {
    error
  } =
    await sb
      .from(
        "application_events"
      )
      .insert({

        application_id:
          applicationId,

        user_id:
          currentSession.user.id,

        event_type:
          status,

        event_date:
          new Date()
            .toISOString(),

        details

      });


  if(error){

    console.error(
      "Cloud event error:",
      error
    );

  }

}


/* =========================
   CHANGE STATUS
========================= */

async function changeStatus(
  id,
  status
){

  const a =
    apps.find(
      x =>
        x.id === id
    );


  if(!a) return;


  if(
    a.status ===
    status
  ){

    return;

  }


  const oldStatus =
    a.status;


  a.status =
    status;


  a.history =
    a.history || [];


  a.history.push({

    status,

    date:
      new Date()
        .toISOString(),

    source:
      "manual"

  });


  save();

  render();


  if(
    sb &&
    currentSession
  ){

    const {
      error
    } =
      await sb
        .from(
          "applications"
        )
        .update({
          status
        })
        .eq(
          "id",
          id
        )
        .eq(
          "user_id",
          currentSession.user.id
        );


    if(error){

      console.error(
        "Status update error:",
        error
      );


      a.status =
        oldStatus;


      a.history.pop();

      save();

      render();

      alert(
        "Could not update the cloud status."
      );

      return;

    }


    await insertCloudEvent(
      id,
      status,
      {
        source:
          "manual",

        previous_status:
          oldStatus
      }
    );

  }

}


/* =========================
   DELETE
========================= */

async function removeApp(id){

  if(
    !confirm(
      "Delete this application?"
    )
  ){

    return;

  }


  const previous =
    apps.find(
      a =>
        a.id === id
    );


  apps =
    apps.filter(
      a =>
        a.id !== id
    );


  save();

  render();


  if(
    sb &&
    currentSession
  ){

    const {
      error
    } =
      await sb
        .from(
          "applications"
        )
        .delete()
        .eq(
          "id",
          id
        )
        .eq(
          "user_id",
          currentSession.user.id
        );


    if(error){

      console.error(
        "Delete error:",
        error
      );


      if(previous){

        apps.unshift(
          previous
        );

        save();

        render();

      }


      alert(
        "Could not delete the cloud application."
      );

    }

  }

}

/* =========================
   CLOUD LOAD
========================= */

async function loadCloudApplications(){

  if(
    !sb ||
    !currentSession
  ){

    return;

  }


  const {
    data,
    error
  } =
    await sb
      .from(
        "applications"
      )
      .select("*")
      .eq(
        "user_id",
        currentSession.user.id
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(error){

    console.error(
      "Load applications error:",
      error
    );

    return;

  }


  const {
    data:eventData,
    error:eventError
  } =
    await sb
      .from(
        "application_events"
      )
      .select("*")
      .eq(
        "user_id",
        currentSession.user.id
      )
      .order(
        "event_date",
        {
          ascending:true
        }
      );


  if(eventError){

    console.error(
      "Load events error:",
      eventError
    );

  }


  const eventsByApplication =
    {};


  (eventData || [])
    .forEach(
      event => {

        if(
          !eventsByApplication[
            event.application_id
          ]
        ){

          eventsByApplication[
            event.application_id
          ] = [];

        }


        eventsByApplication[
          event.application_id
        ].push({

          status:
            event.event_type ||
            "Status update",

          date:
            event.event_date,

          source:
            event.details?.source ||
            "system"

        });

      }
    );


  apps =
    (data || [])
      .map(
        a => {

          let history =
            eventsByApplication[
              a.id
            ] || [];


          if(
            history.length === 0 &&
            a.applied_date
          ){

            history = [

              {

                status:
                  "Applied",

                date:
                  a.applied_date,

                source:
                  "legacy"

              }

            ];

          }


          return {

            id:
              a.id,

            company:
              a.company,

            role:
              a.role,

            source:
              a.source,

            status:
              a.status,

            applied:
              a.applied_date,

            location:
              a.location,

            recruiter:
              a.recruiter_name,

            contacted:
              a.contacted_date,

            email:
              a.recruiter_email,

            phone:
              a.recruiter_phone,

            url:
              a.job_url,

            notes:
              a.notes,

            priority:
              a.priority ||
              "Medium",

            followup:
              a.followup_date ||
              "",

            interviewDate:
              a.interview_date ||
              "",

            noticePeriod:
              a.notice_period ||
              "",

            currentCtc:
              a.current_ctc ||
              "",

            expectedCtc:
              a.expected_ctc ||
              "",

            offeredCtc:
              a.offered_ctc ||
              "",

            history

          };

        }
      );


  save();

}


/* =========================

========================= */

function showAuth(){

  if(!configured()){

    $("authArea").innerHTML = `

      <div class="small">

        Supabase is not configured.

        Add the Publishable Key to

        <b>
          supabase-config.js
        </b>

      </div>

    `;

    return;

  }


  if(!sb){

    sb =
      window.supabase.createClient(

        window.JOB_TRACKER_SUPABASE.url,

        window.JOB_TRACKER_SUPABASE.publishableKey,

        {

          auth:{

            persistSession:
              true,

            autoRefreshToken:
              true,

            detectSessionInUrl:
              true

          }

        }

      );

  }


  sb.auth
    .getSession()
    .then(
      async ({
        data
      }) => {

        currentSession =
          data.session;

        updateAuthUI();

      }
    );


  sb.auth.onAuthStateChange(
    async (
      event,
      session
    ) => {

      currentSession =
        session;


      gmailConnected =
        !!(
          session &&
          session.provider_token
        );


      if(
        session &&
        session.provider_token
      ){

        sessionStorage.setItem(
          "jobTrackerGoogleToken",
          session.provider_token
        );

      }


      if(
        session &&
        session.provider_refresh_token
      ){

        sessionStorage.setItem(
          "jobTrackerGoogleRefreshToken",
          session.provider_refresh_token
        );

      }


      if(
        event ===
        "SIGNED_OUT"
      ){

        sessionStorage.removeItem(
          "jobTrackerGoogleToken"
        );

        sessionStorage.removeItem(
          "jobTrackerGoogleRefreshToken"
        );

      }


      updateAuthUI();

    }
  );

}

/* =========================
   GOOGLE CONNECT
========================= */

async function connectGoogle(){

  if(!configured()){

    alert(
      "First add the Supabase Publishable Key to supabase-config.js."
    );

    return;

  }


  const {
    error
  } =
    await sb.auth.signInWithOAuth({

      provider:
        "google",

      options:{

        scopes:
          "openid email profile https://www.googleapis.com/auth/gmail.readonly",

        queryParams:{

          access_type:
            "offline",

          prompt:
            "consent"

        },

        redirectTo:
          window.location.href

      }

    });


  if(error){

    alert(
      error.message
    );

  }

}

/* =========================
   GMAIL SYNC
========================= */

async function syncGmail(){

  const result =
    $("syncResult");


  if(result){

    result.innerHTML =
      "⏳ Scanning Gmail...";

  }


  try{

    const {
      data,
      error:sessionError
    } =
      await sb.auth.getSession();


    if(sessionError){

      throw sessionError;

    }


    if(!data.session){

      throw new Error(
        "Please connect Gmail again."
      );

    }


    const gmailAccessToken =
      data.session.provider_token;


    if(!gmailAccessToken){

      throw new Error(
        "Gmail access token is unavailable. Please disconnect and reconnect Gmail."
      );

    }


    const response =
      await fetch(

        "https://kmupwiaesqrmzdgfzedr.supabase.co/functions/v1/sync-gmail",

        {

          method:
            "POST",

          headers:{

            "Authorization":
              `Bearer ${data.session.access_token}`,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              gmailAccessToken

            })

        }

      );


    const json =
      await response.json();


    if(!response.ok){

      throw new Error(

        json.error ||
        json.details ||
        "Gmail sync failed."

      );

    }


    if(result){

      result.innerHTML = `

        ✅ Gmail Sync Complete

        <br>

        Emails scanned:
        <b>
          ${json.scanned || 0}
        </b>

        <br>

        New applications:
        <b>
          ${json.newApplications || 0}
        </b>

        <br>

        Updated applications:
        <b>
          ${json.updatedApplications || 0}
        </b>

      `;

    }


    await loadCloudApplications();

    fill();

    render();


  }catch(error){

    console.error(
      "Gmail Sync Error:",
      error
    );


    if(result){

      result.innerHTML =
        `❌ ${esc(
          error.message ||
          "Gmail sync failed."
        )}`;

    }

  }

}


/* =========================
   CSV EXPORT
========================= */

function csvEscape(value){

  const text =
    String(
      value ?? ""
    );


  if(
    text.includes(",") ||
    text.includes('"') ||
    text.includes("\n")
  ){

    return `"${text.replace(
      /"/g,
      '""'
    )}"`;

  }


  return text;

}


function exportCSV(){

  const headers = [

    "Company",
    "Role",
    "Source",
    "Status",
    "Applied Date",
    "Location",
    "Priority",
    "Follow-up Date",
    "Interview Date",
    "Notice Period",
    "Current CTC",
    "Expected CTC",
    "Offered CTC",
    "Recruiter",
    "Contacted Date",
    "Email",
    "Phone",
    "Job URL",
    "Notes"

  ];


  const rows =
    apps.map(
      a => [

        a.company,
        a.role,
        a.source,
        a.status,
        a.applied,
        a.location,
        a.priority,
        a.followup,
        a.interviewDate,
        a.noticePeriod,
        a.currentCtc,
        a.expectedCtc,
        a.offeredCtc,
        a.recruiter,
        a.contacted,
        a.email,
        a.phone,
        a.url,
        a.notes

      ]
        .map(csvEscape)
        .join(",")
    );


  const csv =
    [
      headers
        .map(csvEscape)
        .join(","),

      ...rows

    ].join("\n");


  downloadFile(
    csv,
    "job-tracker-export.csv",
    "text/csv"
  );

}


/* =========================
   JSON BACKUP
========================= */

function backupJSON(){

  const data =

      apps,
      null,
      2
    );


  downloadFile(
    data,
    `job-tracker-backup-${today()}.json`,
    "application/json"
  );

}


function downloadFile(
  content,
  filename,
  type
){

  const blob =
    new Blob(
      [content],
      {type}
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href =
    url;

  a.download =
    filename;

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(
    url
  );

}


/* =========================
   JSON IMPORT
========================= */

function importJSON(event){

  const file =
    event.target.files[0];


  if(!file) return;


  const reader =
    new FileReader();


  reader.onload =
    function(){

      try{

        const imported =
          JSON.parse(
            reader.result
          );


        if(
          !Array.isArray(
            imported
          )
        ){

          throw new Error(
            "Invalid backup file."
          );

        }


        const ok =
          confirm(
            `Import ${imported.length} applications? This will replace your current local list.`
          );


        if(!ok){

          event.target.value =
            "";

          return;

        }


        apps =
          imported;


        save();

        render();


        alert(
          "Backup imported successfully."
        );


      }catch(error){

        alert(
          "Could not import backup: " +
          error.message
        );

      }


      event.target.value =
        "";

    };


  reader.readAsText(
    file
  );

}
